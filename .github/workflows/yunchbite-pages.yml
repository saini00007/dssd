name: Yunch Bite site preview (GitHub Pages)

on:
  push:
    branches: [claude/magical-johnson-76y544]
    paths: ["yunchbite-redesign/site/**", ".github/workflows/yunchbite-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yunchbite-redesign/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yunchbite-redesign/site/package-lock.json
      - run: npm ci
      - name: Static export (server features removed for Pages)
        run: node scripts/prepare-static-export.mjs && npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /dssd
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yunchbite-redesign/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
